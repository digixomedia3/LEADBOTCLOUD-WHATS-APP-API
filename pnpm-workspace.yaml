packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 does not run dependency install scripts unless they are approved here. Only these need them:
# esbuild verifies its native binary (used by tsx and vitest); msgpackr-extract is an optional native speed-up for BullMQ.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
